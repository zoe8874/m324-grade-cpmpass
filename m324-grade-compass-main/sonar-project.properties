# must be unique in a given SonarQube instance
sonar.projectKey=grade-compass
sonar.projectName=Notenkompass

# Path is relative to the sonar-project.properties file.
sonar.sources=backend/src/main,frontend/src
sonar.tests=backend/src/test
# Die Tests des Frontends liegen im Verzeichnis der Sources
sonar.test.inclusions=**/*.spec.ts,**/*Test.java,**/*Tests.java

# Backend: kompilierte Klassen und Libraries
sonar.java.binaries=backend/target/classes
sonar.java.libraries=backend/target/dependency/*.jar
sonar.java.test.binaries=backend/target/test-classes
sonar.java.test.libraries=backend/target/dependency/*.jar
sonar.java.source=25

# Check code coverage
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
# Das Frontend wird nicht in die Test Coverage einbezogen
sonar.coverage.exclusions=frontend/**